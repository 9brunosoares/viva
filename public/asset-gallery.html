<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Viva! · Auditoria de assets</title><style>body{font:14px system-ui;background:#e7e0d0;margin:25px}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:15px}article{background:white;padding:12px;border-radius:14px}figure{display:flex;margin:0}figure div{width:50%;height:170px;background:#fff}figure div+div{background:#193b30}img{width:100%;height:100%;object-fit:contain}p{overflow-wrap:anywhere}</style><h1>Viva! · Assets preparados</h1><p>Página técnica independente. Cada recorte aparece sobre fundo claro e escuro.</p><main></main><script type="module">const assets=await fetch('./assets/manifest.json').then(r=>r.json());for(const a of assets){const card=document.createElement('article');const name=document.createElement('p');name.textContent=a.name+' · '+a.dimensions.join(' × ');const figure=document.createElement('figure');for(let i=0;i<2;i++){const div=document.createElement('div');const img=document.createElement('img');img.src='./'+a.file;img.alt=a.name;img.loading='lazy';div.append(img);figure.append(div);}card.append(name,figure);document.querySelector('main').append(card);}</script></html>
