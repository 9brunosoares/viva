<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#194b37" />
    <meta name="apple-mobile-web-app-title" content="Viva!" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="description"
      content="Um joguinho pra viver e passar o tempo. Combine peças e descubra histórias."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/icon-192.png" />
    <link rel="icon" type="image/png" href="./assets/icon-192.png" />
    <link rel="preload" as="image" href="./assets/logo.webp" />
    <link rel="preload" as="font" type="font/woff2" href="./assets/fonts/nunito-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="./assets/fonts/fraunces-latin.woff2" crossorigin />
    <title>Viva! — Um joguinho pra viver e passar o tempo</title>
    <script>
      window.addEventListener(
        "error",
        function (event) {
          if (
            event.target instanceof HTMLScriptElement &&
            event.target.type === "module"
          ) {
            document.getElementById("boot-retry")?.removeAttribute("hidden");
            document
              .getElementById("boot-status")
              ?.replaceChildren("Vamos tentar de novo?");
          }
        },
        true,
      );
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: #102e25;
      }
      .launch {
        color: #fff1d3;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        font:
          17px/1.5 Nunito,
          sans-serif;
      }
      .launch img {
        width: min(280px, 80vw);
        height: auto;
      }
      .launch button {
        font: inherit;
        min-height: 48px;
        padding: 12px 24px;
        border: 1px solid #d8b475;
        border-radius: 18px;
        background: #315e3a;
        color: #fff1d3;
      }
      .launch [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="launch">
        <img
          src="./assets/logo.webp"
          width="280"
          height="160"
          alt="Viva!"
          fetchpriority="high"
        />
        <span id="boot-status" role="status">Abrindo seu cantinho…</span>
        <button id="boot-retry" hidden onclick="location.reload()">
          Tentar novamente
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
